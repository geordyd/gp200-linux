name: Feature request
description: Suggest an improvement to GP200 Linux
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: Explain the workflow and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include examples or alternatives if useful.
